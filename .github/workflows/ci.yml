name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: No-mock + unit tests
        run: npm run verify:func

      - name: Production build
        run: npm run build

      - name: Run smoke tests (server + API checks, no API key)
        env:
          ANTHROPIC_API_KEY: ''
        run: npm run smoke-test:ci
