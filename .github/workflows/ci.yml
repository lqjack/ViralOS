name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run verify

      - name: Run full smoke tests (server + 8 API checks)
        env:
          ANTHROPIC_API_KEY: ''
        run: npm run smoke-test:ci
